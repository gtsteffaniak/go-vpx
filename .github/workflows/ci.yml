name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'benchmarks/baselines/**'
      - 'AGENTS.md'
      - 'README*'
  pull_request:
    paths-ignore:
      - 'benchmarks/baselines/**'
      - 'AGENTS.md'
      - 'README*'

  workflow_dispatch:
    inputs:
      full:
        description: Run conformance, quality, oracle and parity gates in addition to routine Go checks
        default: false
        required: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOEXPERIMENT: simd
  GOTOOLCHAIN: go1.27.2
  GOVPX_FULL_CI: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.full) }}

jobs:
  test:
    name: Exhaustive test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Report CI scope
        run: |
          if [ "$GOVPX_FULL_CI" = true ]; then
            echo 'Full CI: routine Go checks plus conformance, quality, oracle and parity gates.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Routine CI: source/PGO, pinned control tables, native SIMD, pure-Go fallback and trace build. Full gates run on main pushes or manual full=true.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install libvpx build tools
        if: ${{ env.GOVPX_FULL_CI == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm yasm

      - name: Source and PGO checks
        run: make test-noasm test-simd-selection fmtcheck pgo-check

      - name: Prepare pinned upstream control tables
        run: sh scripts/prepare-control-sources.sh

      - name: Native SIMD tests
        run: make test

      - name: Scalar fallback tests
        run: make test-purego

      - name: Oracle trace build
        run: make test-trace

      - name: VP9 decoder conformance
        if: ${{ env.GOVPX_FULL_CI == 'true' }}
        run: make test-conformance

      - name: Encoder quality gates
        if: ${{ env.GOVPX_FULL_CI == 'true' }}
        run: make test-quality

      - name: Libvpx oracle tests
        if: ${{ env.GOVPX_FULL_CI == 'true' }}
        run: make test-oracle

      - name: Encoder byte parity
        if: ${{ env.GOVPX_FULL_CI == 'true' }}
        run: make test-byte-parity

      - name: Parity regression report
        if: ${{ env.GOVPX_FULL_CI == 'true' }}
        run: make test-parity-report

      - name: Save complete parity diagnostics
        if: ${{ always() && env.GOVPX_FULL_CI == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: parity-report-${{ github.event.pull_request.head.sha || github.sha }}
          path: .parity-report.log
          include-hidden-files: true
          if-no-files-found: ignore
