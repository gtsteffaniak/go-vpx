name: Native amd64 SIMD benchmarks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simd-amd64-bench-${{ github.ref }}
  cancel-in-progress: true

env:
  GOEXPERIMENT: simd
  GOTOOLCHAIN: local
  GOAMD64: v1
  GOMAXPROCS: '1'
  CODEX_AGENT_ID: amd64-bench

jobs:
  benchmark:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 23
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'

      - name: Compare assembly and native Go SIMD on the same CPU
        run: sh scripts/benchmark-amd64.sh 691cd0512c4829d9ee40d483205dd223f9eb028d "$RUNNER_TEMP/amd64-bench"

      - name: Save raw benchmarks and environment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amd64-simd-benchmarks-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/amd64-bench/*.txt
            ${{ runner.temp }}/amd64-bench/*.json
          if-no-files-found: error
